<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact — Dora Jambor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  /* ---------- tokens (Sage palette) ---------- */
  :root {
    --bg:        #f6f5ef;   /* warm cream paper */
    --ink:       #2f3a35;   /* soft forest-charcoal */
    --muted:    #8e9b91;   /* sage grey */
    --rule:      #e2e1d6;   /* hairline */
    --accent:    #6b8e72;   /* dusty sage green */
    --accent-soft: #e8eee6; /* pale sage tint */
    --max:       1240px;
    --sidebar:   280px;
    --gap:       88px;
    --pad-x:     20px;
    --pad-y:     72px;
    --fs-body:   15px;
    --lh-body:   1.75;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--accent); color: var(--bg); }

  /* ---------- layout ---------- */
  .page {
    max-width: var(--max);
    margin: 0 auto;
    padding: var(--pad-y) var(--pad-x);
    display: grid;
    grid-template-columns: var(--sidebar) 1fr;
    gap: var(--gap);
    align-items: start;
  }

  /* ---------- sidebar ---------- */
  aside.sidebar {
    position: sticky;
    top: var(--pad-y);
    align-self: start;
  }

  .portrait {
    width: 92%;
    height: auto;
    aspect-ratio: 1;
    margin: 0 0 32px 0;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--rule);
  }

  .name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 28px 0;
    line-height: 1.3;
  }
  .name::after {
    content: "";
    display: inline-block;
    width: 9px; height: 9px;
    background: var(--accent);
    margin-left: 8px;
    transform: translateY(-1px);
  }
  .id-tags {
    list-style: none;
    padding: 0;
    margin: 0 0 28px 0;
    color: var(--ink);
    font-size: 14px;
  }
  .id-tags li { padding: 0; }

  .social {
    list-style: none;
    padding: 0;
    margin: 0;
    border-top: 1px solid var(--rule);
    padding-top: 20px;
  }
  .social li { padding: 0; }

  /* ---------- right column ---------- */
  main.content { min-width: 0; }

  /* ---------- links ---------- */
  a {
    color: var(--ink);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: color-mix(in oklab, var(--accent) 45%, transparent);
    background: color-mix(in oklab, var(--accent) 25%, transparent);
    padding: 1px 6px;
    transition: text-decoration-color 120ms ease, background-color 120ms ease;
  }
  a:hover {
    text-decoration-color: var(--accent);
    background: color-mix(in oklab, var(--accent) 35%, transparent);
  }
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }
  .social a {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    padding: 4px 8px;
    margin-left: -8px;
    color: var(--accent);
    font-weight: 400;
    border-radius: 3px;
    transition: background 120ms ease;
  }
  .social a:hover {
    background: color-mix(in oklab, var(--accent) 15%, transparent);
  }
  .social svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex-shrink: 0;
  }

  /* ---------- header ---------- */
  .header {
    margin-bottom: 48px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 400;
    background: none;
    padding: 4px 8px;
    margin-left: -8px;
    margin-bottom: 24px;
    border-radius: 3px;
    transition: background 120ms ease;
  }
  .back-link:hover {
    background: color-mix(in oklab, var(--accent) 15%, transparent);
    opacity: 1;
  }
  .back-link::before {
    content: "← ";
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin: 0 0 14px 0;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--muted);
    color: var(--ink);
  }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- contact form ---------- */
  .contact-form {
    padding: 32px;
    background: var(--accent-soft);
    border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
  }
  .contact-form label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .contact-form input,
  .contact-form textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px;
    border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
    background: var(--bg);
    color: var(--ink);
    margin-bottom: 20px;
    border-radius: 2px;
  }
  .contact-form input:focus,
  .contact-form textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 0;
    border-color: var(--accent);
  }
  .contact-form textarea {
    min-height: 140px;
    resize: vertical;
  }
  .contact-form button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 14px 32px;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .contact-form button:hover {
    background: color-mix(in oklab, var(--accent) 85%, var(--ink));
  }
  .contact-form button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 900px) {
    :root {
      --pad-x: 16px;
      --pad-y: 56px;
      --gap: 48px;
    }
    .page {
      grid-template-columns: 1fr;
      gap: 48px;
    }
    aside.sidebar {
      position: static;
    }
    .social {
      display: flex;
      gap: 24px;
      padding-top: 16px;
    }
  }
  @media (max-width: 500px) {
    :root {
      --pad-x: 12px;
      --fs-body: 14px;
    }
    .contact-form {
      padding: 24px 20px;
    }
  }
</style>
</head>
<body>
  <div class="page">

    <!-- ====================== LEFT SIDEBAR ====================== -->
    <aside class="sidebar">
      <img src="speaking - slush 1.jpg" alt="Dora Jambor" class="portrait" />

      <h1 class="name">Dora Jambor</h1>

      <ul class="id-tags">
        <li>Product + AI + startups</li>
        <li>Former Founder &amp; CEO @<a href="https://www.linkedin.com/company/mohanahealth/">Mohana</a></li>
        <li>Former AI researcher @<a href="https://mila.quebec/en">MILA</a></li>
      </ul>

      <ul class="social">
        <li>
          <a href="https://www.linkedin.com/in/dorajambor/" rel="me">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z"/>
            </svg>
            LinkedIn
          </a>
        </li>
        <li>
          <a href="https://dorajambor.substack.com/" rel="me">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/>
            </svg>
            Substack
          </a>
        </li>
        <li>
          <a href="mailto:dorajambor@gmail.com">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            Email
          </a>
        </li>
      </ul>
    </aside>

    <!-- ====================== RIGHT COLUMN (CONTACT FORM) ====================== -->
    <main class="content">
      <div class="header">
        <a href="index.html" class="back-link">Back to main page</a>
        <h1>Let's talk</h1>
      </div>

      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="9220b401-d86e-49b9-b25d-344e82dc2406" />
        <input type="hidden" name="subject" value="New message from dorajambor.com" />
        <input type="hidden" name="from_name" value="Contact Form" />

        <div>
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div>
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div>
          <label for="message">How can I help?</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </main>

  </div>
</body>
</html>
